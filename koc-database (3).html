<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOC・素人合作資料庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3EEDF;
    --surface:#FFFFFF;
    --surface-2:#FBF8EF;
    --ink:#173832;
    --ink-soft:#5E7873;
    --border:#E3DDC8;
    --teal:#0E4A42;
    --teal-2:#146257;
    --gold:#F0B429;
    --gold-dark:#C98F16;
    --accent:#F0B429;
    --accent-2:#146257;
    --danger:#C1554A;
    --radius:16px;
    --radius-pill:999px;
    --shadow:0 1px 2px rgba(15,40,35,.06), 0 12px 28px -14px rgba(15,40,35,.18);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:14px;
    line-height:1.5;
  }
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:600; margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .eyebrow{font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:var(--gold-dark);}
  ::selection{background:#F0B42955;}

  /* ---------- layout ---------- */
  #app{display:flex; flex-direction:column; min-height:100vh;}

  /* hero banner */
  #hero{background:var(--teal); color:#fff; padding:38px 26px 34px;}
  #hero .hero-inner{max-width:1180px; margin:0 auto;}
  #hero .eyebrow{color:var(--gold); font-size:11px;}
  #hero h1{font-size:clamp(26px,4vw,38px); line-height:1.18; color:#fff; margin-top:10px;}
  #hero h1 .accent-text{color:var(--gold); display:block;}
  #hero .hero-sub{margin-top:14px; font-size:13px; color:#BFD6D0; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  #hero .hero-sub .dot{width:6px;height:6px;border-radius:50%;background:var(--accent); display:inline-block;}

  /* control bar: global search + tab pills */
  #controlbar{
    position:sticky; top:0; z-index:20; background:var(--bg);
    border-bottom:1px solid var(--border); padding:16px 26px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  #controlbar .inner{max-width:1180px; margin:0 auto; width:100%; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .search-wrap{flex:1 1 320px; max-width:520px; position:relative;}
  .search-wrap input{
    width:100%; padding:12px 16px 12px 38px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); font-size:13.5px; font-family:'Inter'; color:var(--ink); box-shadow:var(--shadow);
  }
  .search-wrap input:focus{outline:2px solid #F0B42955; background:#fff;}
  .search-wrap .sic{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--ink-soft); font-size:13px;}
  .search-drop{
    position:absolute; top:calc(100% + 8px); left:0; right:0; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);
    max-height:70vh; overflow:auto; z-index:50;
  }
  .search-drop .hint{padding:14px 16px; color:var(--ink-soft); font-size:12.5px;}
  .search-hit{padding:12px 16px; border-bottom:1px solid var(--border); cursor:pointer;}
  .search-hit:last-child{border-bottom:none;}
  .search-hit:hover{background:var(--surface-2);}
  .search-hit .row1{display:flex; align-items:center; gap:8px; font-weight:600;}
  .search-hit .row2{font-size:12px; color:var(--ink-soft); margin-top:2px;}

  nav#nav{display:flex; gap:8px; flex-wrap:wrap; margin-left:auto;}
  nav#nav button{
    all:unset; cursor:pointer; padding:9px 16px; border-radius:999px;
    font-size:12.5px; font-weight:700; color:var(--ink); background:var(--surface);
    border:1px solid var(--border);
  }
  nav#nav button:hover{background:#ECE9DC;}
  nav#nav button.active{background:var(--teal); color:#fff; border-color:var(--teal);}

  #main{flex:1; min-width:0; display:flex; flex-direction:column;}
  #content{padding:22px 26px 60px; flex:1; max-width:1180px; margin:0 auto; width:100%;}
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:20px;}
  .panel-head{padding:16px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .panel-head h3{font-size:16px;}
  .panel-head .sub{font-size:12px; color:var(--ink-soft);}
  .panel-body{padding:16px 18px;}
  .spacer{flex:1;}

  /* buttons */
  .btn{
    all:unset; cursor:pointer; font-family:'Inter'; font-size:12.5px; font-weight:600;
    padding:8px 13px; border-radius:7px; background:var(--surface-2); color:var(--ink);
    border:1px solid var(--border); display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{background:#ECE9DC;}
  .btn.primary{background:var(--ink); color:#fff; border-color:var(--ink);}
  .btn.primary:hover{background:#354036;}
  .btn.accent{background:var(--accent); color:#fff; border-color:var(--accent);}
  .btn.accent:hover{background:#B56C25;}
  .btn.ghost{background:transparent; border-color:transparent;}
  .btn.danger{color:var(--danger); border-color:#E7C9C4; background:#FBF3F1;}
  .btn.sm{padding:5px 9px; font-size:11.5px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  /* table */
  .tbl-wrap{overflow-x:auto; border-radius:8px; border:1px solid var(--border);}
  table.data{border-collapse:collapse; width:100%; min-width:900px;}
  table.data th{
    background:var(--surface-2); text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.3px;
    color:var(--ink-soft); font-weight:600; padding:9px 10px; border-bottom:1px solid var(--border); white-space:nowrap;
  }
  table.data td{padding:6px 8px; border-bottom:1px solid var(--border); vertical-align:middle;}
  table.data tbody tr{transition:background .1s;}
  table.data tbody tr:hover{background:#FAF9F3;}
  table.data tbody tr.new-row{background:#F1F6EC;}
  td .cell-input, td select, td textarea{
    width:100%; min-width:88px; border:1px solid transparent; background:transparent;
    padding:6px 7px; border-radius:6px; font-family:'Inter'; font-size:12.5px; color:var(--ink);
  }
  td .cell-input:hover, td select:hover, td textarea:hover{border-color:var(--border); background:var(--surface-2);}
  td .cell-input:focus, td select:focus, td textarea:focus{outline:none; border-color:var(--accent); background:#fff;}
  td textarea{resize:vertical; min-height:32px;}
  .accent-bar{width:6px; padding:0 !important;}
  .accent-bar div{height:100%; min-height:34px; border-radius:3px;}
  .row-color-cell{display:flex; align-items:center; gap:4px;}
  input[type=color].tiny{width:22px; height:22px; padding:0; border:1px solid var(--border); border-radius:5px; cursor:pointer; background:none;}
  .clear-color{all:unset; cursor:pointer; font-size:10px; color:var(--ink-soft); padding:2px;}
  .clear-color:hover{color:var(--danger);}

  .badge{
    display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px;
    font-size:12px; font-weight:600; white-space:nowrap;
  }
  .badge .bdot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85;}
  select.status-select{border-radius:999px; font-weight:600; text-align:left; padding-left:10px;}
  .tag{display:inline-flex; align-items:center; padding:3px 9px; border-radius:6px; font-size:11px; font-weight:600; margin:0 4px 4px 0; cursor:pointer; border:1px solid transparent;}
  .tag.off{background:var(--surface-2); color:var(--ink-soft); border-color:var(--border);}
  .type-tags{display:flex; flex-wrap:wrap; max-width:190px;}
  .count-pill{
    display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:999px; background:var(--surface-2);
    border:1px solid var(--border); font-size:12px; font-weight:600; cursor:pointer;
  }
  .count-pill:hover{background:#ECE9DC;}
  .del-btn{all:unset; cursor:pointer; color:var(--ink-soft); font-size:14px; padding:4px 6px; border-radius:6px;}
  .del-btn:hover{color:var(--danger); background:#FBF3F1;}

  .empty{padding:40px 20px; text-align:center; color:var(--ink-soft);}
  .empty .big{font-size:28px; margin-bottom:8px;}

  /* modal */
  .modal-mask{position:fixed; inset:0; background:rgba(20,24,20,.45); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:100; overflow:auto;}
  .modal{background:var(--surface); border-radius:14px; width:100%; max-width:640px; box-shadow:0 30px 60px -20px rgba(0,0,0,.4); margin-bottom:5vh;}
  .modal.wide{max-width:880px;}
  .modal-head{padding:18px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px;}
  .modal-head h3{font-size:17px;}
  .modal-head .x{margin-left:auto; cursor:pointer; font-size:18px; color:var(--ink-soft); background:none; border:none;}
  .modal-body{padding:20px 22px; max-height:70vh; overflow:auto;}
  .modal-foot{padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 16px;}
  .form-grid .full{grid-column:1/-1;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-family:'Inter'; font-size:13px; background:var(--surface-2);
  }
  .field textarea{min-height:64px; resize:vertical;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--accent); background:#fff;}

  /* assignment modal */
  .assign-row{border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px; background:var(--surface-2);}
  .assign-row .row-top{display:flex; gap:10px; align-items:center; margin-bottom:8px;}
  .assign-row select{flex:1; padding:8px 10px; border-radius:7px; border:1px solid var(--border); background:#fff; font-size:13px;}

  /* settings */
  .settings-list{display:flex; flex-direction:column; gap:8px;}
  .settings-row{display:flex; align-items:center; gap:10px; padding:9px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface-2);}
  .settings-row input[type=text]{flex:1; border:1px solid var(--border); border-radius:6px; padding:7px 9px; font-size:13px; background:#fff;}
  .swatch-wrap{display:flex; align-items:center; gap:6px;}
  .field-grid-add{display:grid; grid-template-columns:1.3fr 1fr .9fr auto; gap:8px; align-items:end; margin-top:14px;}
  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-size:12.5px; font-weight:600; z-index:200; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .history-item{padding:10px 12px; border:1px solid var(--border); border-radius:8px; margin-bottom:8px; background:var(--surface-2);}
  .history-item .h1{font-weight:600; font-size:13px; display:flex; gap:8px; align-items:center;}
  .history-item .h2{font-size:11.5px; color:var(--ink-soft); margin-top:3px;}

  .profile-card{display:flex; gap:14px; padding:14px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; margin-bottom:16px;}
  .profile-card .avatar{width:46px;height:46px;border-radius:50%;background:var(--accent-2); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; flex:none;}
  .kv{font-size:12.5px; color:var(--ink-soft); margin-top:4px;}
  .kv b{color:var(--ink); font-weight:600;}

  @media(max-width:880px){
    #hero{padding:28px 18px 26px;}
    #controlbar{padding:14px 18px;}
    #controlbar .inner{flex-direction:column; align-items:stretch;}
    .search-wrap{max-width:none;}
    nav#nav{margin-left:0;}
    #content{padding:18px 18px 50px;}
    .form-grid{grid-template-columns:1fr;}
    table.data{min-width:760px;}
  }
</style>
</head>
<body>
<div id="app">
  <header id="hero">
    <div class="hero-inner">
      <div class="eyebrow">已經在努力了 不要逼</div>
      <h1>管好每一位合作對象，<span class="accent-text">排好每一檔期。</span></h1>
      <div class="hero-sub"><span class="dot"></span>合作檔期庫 · KOC ／ 汪喵、HM、超凝素人管理 · 共用資料庫，所有使用此連結的人皆可檢視 / 編輯</div>
    </div>
  </header>

  <div id="controlbar">
    <div class="inner">
      <div class="search-wrap">
        <span class="sic">🔍</span>
        <input id="globalSearch" placeholder="貼上 IG / Threads 帳號名或稱呼，查詢是否已在名單中…" autocomplete="off">
        <div id="searchDrop" class="search-drop" style="display:none;"></div>
      </div>
      <nav id="nav">
        <button data-tab="projects" class="active">▤ 檔期排程</button>
        <button data-tab="collabs">◍ 合作名單</button>
        <button data-tab="settings">⚙ 欄位與顏色設定</button>
      </nav>
    </div>
  </div>

  <main id="main">
    <div id="content"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

/* 儲存層：優先使用 Claude Artifact 的 window.storage（跨使用者共用資料庫）。
   若此頁面是被下載後直接用瀏覽器開啟 / 架在其他網站上，window.storage 不存在，
   會自動改用瀏覽器 localStorage 做「僅限這台電腦、這個瀏覽器」的本機儲存，
   確保重新整理網頁後資料不會消失。 */
const storage = window.storage ? window.storage : {
  async get(key){
    const v = localStorage.getItem('kocdb:'+key);
    if(v===null) throw new Error('not found');
    return {key, value:v};
  },
  async set(key, value){ localStorage.setItem('kocdb:'+key, value); return {key, value}; },
};
const usingLocalFallback = !window.storage;

async function loadAll(){
  try{
    const c = await storage.get('app-config', true);
    if(c && c.value) cfg = Object.assign(cfg, JSON.parse(c.value));
  }catch(e){}
  try{
    const p = await storage.get('projects-data', true);
    if(p && p.value) projects = JSON.parse(p.value);
  }catch(e){}
  try{
    const cl = await storage.get('collaborators-data', true);
    if(cl && cl.value) collabs = JSON.parse(cl.value);
  }catch(e){}
  loaded = true;
  render();
  if(usingLocalFallback) showToast('⚠️ 目前以本機瀏覽器儲存（僅此電腦此瀏覽器看得到資料）');
}

let saveTimers = {};
function saveKey(key, value){
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(async ()=>{
    try{ await storage.set(key, JSON.stringify(value), true); }
    catch(e){ showToast('❌ 儲存失敗，請檢查網路連線'); }
  }, 250);
}
function saveConfig(){ saveKey('app-config', cfg); }
function saveProjects(){ saveKey('projects-data', projects); }
function saveCollabs(){ saveKey('collaborators-data', collabs); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ============================= 小工具 ============================= */
function statusOf(id){ return cfg.statuses.find(s=>s.id===id) || cfg.statuses[0]; }
function contrastText(hex){
  hex = (hex||'#888888').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const r=parseInt(hex.substr(0,2),16), g=parseInt(hex.substr(2,2),16), b=parseInt(hex.substr(4,2),16);
  const lum = (0.299*r+0.587*g+0.114*b)/255;
  return lum > 0.62 ? '#232B26' : '#FFFFFF';
}
function hexToRgba(hex, a){
  hex = (hex||'#888888').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const r=parseInt(hex.substr(0,2),16), g=parseInt(hex.substr(2,2),16), b=parseInt(hex.substr(4,2),16);
  return `rgba(${r},${g},${b},${a})`;
}
function typeTagHtml(t, active, id){
  const color = TYPE_COLORS[t] || '#5E7873';
  const style = active ? `background:${hexToRgba(color,.16)};color:${color};` : '';
  return `<span class="tag ${active?'':'off'}" style="${style}" data-action="toggleType" data-type="${esc(t)}" data-id="${esc(id)}">${esc(t)}</span>`;
}
function typeBadgesHtml(types){
  return (types||[]).map(t=>{
    const color = TYPE_COLORS[t] || '#5E7873';
    return `<span class="tag" style="background:${hexToRgba(color,.16)};color:${color};">${esc(t)}</span>`;
  }).join('') || `<span class="tag off">未設定</span>`;
}
function quarterOptions(){
  const opts = [];
  for(let y=2024;y<=2028;y++){
    for(let q=1;q<=4;q++) opts.push(`${y}Q${q}`);
  }
  return opts;
}
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtFollowers(n){
  n = Number(n||0);
  if(!n) return '—';
  if(n>=10000) return (n/10000).toFixed(n%10000===0?0:1)+'萬';
  return n.toLocaleString();
}

});

  else content.innerHTML = renderSettings();
  bindDynamic();
}

function importSeedProjects(){
  if(!SEED_PROJECTS.length){ showToast('沒有可匯入的資料'); return; }
  const needed = [
    {id:'collab_type', label:'合作類型', type:'select', options:['產品推廣','新品推廣','活動檔期 / 銷售','公益活動','線下活動','常態推廣']},
    {id:'month', label:'月份', type:'text'},
    {id:'ref_file', label:'參考檔案', type:'text'},
  ];
  needed.forEach(n=>{
    if(!cfg.projectFields.some(f=>f.id===n.id)) cfg.projectFields.push(n);
  });
  const existingNames = new Set(projects.map(p=>(p.taskName||'').toLowerCase()).filter(Boolean));
  let added = 0, skipped = 0;
  SEED_PROJECTS.forEach(s=>{
    const key = (s.taskName||'').toLowerCase();
    if(key && existingNames.has(key)){ skipped++; return; }
    const p = newProject({
      taskName: s.taskName, brand: s.brand, quarter: s.quarter, status: s.status,
      owner: s.owner, startDate: s.startDate, briefDeadline: s.briefDeadline, launchDate: s.launchDate,
      notes: s.notes, custom: s.custom,
    });
    projects.push(p);
    existingNames.add(key);
    added++;
  });
  saveConfig(); saveProjects(); render();
  showToast(`已匯入 ${added} 筆任務，略過重複 ${skipped} 筆`);
}

function customCellHtml(rec, f){
  const val = (rec.custom && rec.custom[f.id]!==undefined) ? rec.custom[f.id] : '';

    const opts = (f.options||[]).map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(o)}</option>`).join('');
    return `<td><select class="cell-input" data-custom="${f.id}"><option value=""></option>${opts}</select></td>`;
  }
  if(f.type==='date') return `<td><input type="date" class="cell-input" data-custom="${f.id}" value="${esc(val)}"></td>`;
  if(f.type==='number') return `<td><input type="number" class="cell-input" data-custom="${f.id}" value="${esc(val)}"></td>`;
  return `<td><input class="cell-input" data-custom="${f.id}" value="${esc(val)}"></td>`;
}

function daysSince(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return null;
  return Math.floor((Date.now()-d.getTime())/86400000);
}
function freshnessHtml(dateStr){
  const days = daysSince(dateStr);
  if(days===null) return `<span style="font-size:10px;color:var(--ink-soft);">尚未更新</span>`;
  let color = '#4C8A4F', label = `${days}天前更新`;
  if(days>90){ color='#B5493D'; label = `${days}天未更新`; }
  else if(days>30){ color='#C97A2E'; label = `${days}天前更新`; }
  if(days===0) label = '今天已更新';
  return `<span style="font-size:10px;color:${color};font-weight:600;">${label}</span>`;
}

function importSeedCollabs(){
  if(!SEED_COLLABS.length){ showToast('沒有可匯入的資料'); return; }
  // 確保「合作次數」「級別」自訂欄位存在
  const needed = [
    {id:'collab_count', label:'合作次數', type:'text'},
    {id:'tier', label:'級別', type:'text'},
  ];
  needed.forEach(n=>{
    if(!cfg.collabFields.some(f=>f.id===n.id)) cfg.collabFields.push(n);
  });
  const existingAccounts = new Set(collabs.map(c=>(c.account||'').toLowerCase()).filter(Boolean));
  const existingNames = new Set(collabs.map(c=>(c.nickname||'').toLowerCase()).filter(Boolean));
  let added = 0, skipped = 0;
  SEED_COLLABS.forEach(s=>{
    const accKey = (s.account||'').toLowerCase();
    const nameKey = (s.nickname||'').toLowerCase();
    if((accKey && existingAccounts.has(accKey)) || (nameKey && existingNames.has(nameKey))){
      skipped++; return;
    }
    const c = newCollab({
      nickname: s.nickname, account: s.account, igLink: s.igLink,
      igFollowers: s.igFollowers, igFollowersUpdatedAt: s.igFollowers ? new Date().toISOString().slice(0,10) : '',
      threadsFollowers: s.threadsFollowers, petType: s.petType, quoteMode: s.quoteMode,
      notes: s.notes, pastWorks: s.pastWorks, region: s.region,
      types: s.types, custom: s.custom,
    });
    collabs.push(c);
    existingAccounts.add(accKey); existingNames.add(nameKey);
    added++;
  });
  saveConfig(); saveCollabs(); render();
  showToast(`已匯入 ${added} 筆，略過重複 ${skipped} 筆`);
}

/* ============================= 事件綁定（每次 render 後執行） ============================= */
function bindDynamic(){
  // ---- projects table ----
  const projTbody = document.getElementById('projTbody');
  if(projTbody){
    projTbody.addEventListener('change', onProjectFieldChange);
    projTbody.addEventListener('click', onProjectRowClick);
  }
  const addRowBtn = document.getElementById('btnAddRowInline');
  if(addRowBtn) addRowBtn.onclick = ()=>{
    projects.push(newProject()); saveProjects(); render();
    setTimeout(()=>{ const rows=document.querySelectorAll('#projTbody tr'); const last=rows[rows.length-1]; if(last) last.querySelector('input[data-field=taskName]')?.focus(); },0);
  };
  const addFormBtn = document.getElementById('btnAddProjectForm');
  if(addFormBtn) addFormBtn.onclick = ()=>openProjectFormModal();
  const importProjBtn = document.getElementById('btnImportProjects');
  if(importProjBtn) importProjBtn.onclick = importSeedProjects;

  // ---- collabs table ----
  const collabTbody = document.getElementById('collabTbody');
  if(collabTbody){
    collabTbody.addEventListener('change', onCollabFieldChange);
    collabTbody.addEventListener('click', onCollabRowClick);
  }
  const addCollabRowBtn = document.getElementById('btnAddCollabInline');
  if(addCollabRowBtn) addCollabRowBtn.onclick = ()=>{
    collabs.push(newCollab()); saveCollabs(); render();
    setTimeout(()=>{ const rows=document.querySelectorAll('#collabTbody tr'); const last=rows[rows.length-1]; if(last) last.querySelector('input[data-field=nickname]')?.focus(); },0);
  };
  const addCollabFormBtn = document.getElementById('btnAddCollabForm');
  if(addCollabFormBtn) addCollabFormBtn.onclick = ()=>openCollabFormModal();
  const importBtn = document.getElementById('btnImportSeed');
  if(importBtn) importBtn.onclick = importSeedCollabs;

  // ---- settings ----
  bindSettingsEvents();
}

function onProjectFieldChange(e){
  const tr = e.target.closest('tr'); if(!tr) return;
  const id = tr.dataset.id; const p = projects.find(x=>x.id===id); if(!p) return;
  const field = e.target.dataset.field, custom = e.target.dataset.custom;
  if(field==='rowColor'){
    const st = statusOf(p.status);
    p.rowColor = (e.target.value.toLowerCase()===st.color.toLowerCase()) ? '' : e.target.value;
  } else if(field){ p[field] = e.target.value; }
  else if(custom){ p.custom = p.custom||{}; p.custom[custom] = e.target.value; }
  saveProjects();
  if(field==='status' || field==='rowColor') render(); else refreshRowBar(tr,p);
}
function refreshRowBar(tr,p){
  const st = statusOf(p.status);
  const bar = tr.querySelector('.accent-bar div');
  if(bar) bar.style.background = p.rowColor || st.color;
}

function onProjectRowClick(e){
  const assignBtn = e.target.closest('[data-action=assign]');
  if(assignBtn){ openAssignModal(assignBtn.dataset.id); return; }
  const delBtn = e.target.closest('[data-action=delProject]');
  if(delBtn){
    const id = delBtn.dataset.id;
    if(confirm('確定要刪除此專案嗎？此動作無法復原。')){
      projects = projects.filter(p=>p.id!==id); saveProjects(); render();
    }
    return;
  }
  const clearBtn = e.target.closest('[data-action=clearColor]');
  if(clearBtn){
    const p = projects.find(x=>x.id===clearBtn.dataset.id);
    if(p){ p.rowColor=''; saveProjects(); render(); }
    return;
  }
}

function onCollabFieldChange(e){
  const tr = e.target.closest('tr'); if(!tr) return;
  const id = tr.dataset.id; const c = collabs.find(x=>x.id===id); if(!c) return;
  const field = e.target.dataset.field, custom = e.target.dataset.custom;
  if(field){
    c[field] = e.target.value;
    if(field==='igFollowers'){ c.igFollowersUpdatedAt = new Date().toISOString().slice(0,10); }
  }
  else if(custom){ c.custom = c.custom||{}; c.custom[custom] = e.target.value; }
  saveCollabs();
  if(field==='igFollowers' || field==='igLink') render();
}
function onCollabRowClick(e){
  const tag = e.target.closest('[data-action=toggleType]');
  if(tag){
    const c = collabs.find(x=>x.id===tag.dataset.id); if(!c) return;
    const t = tag.dataset.type;
    if(c.types.includes(t)) c.types = c.types.filter(x=>x!==t);
    else c.types = [...c.types, t];
    saveCollabs(); render();
    return;
  }
  const delBtn = e.target.closest('[data-action=delCollab]');
  if(delBtn){
    if(confirm('確定要刪除此合作對象嗎？此動作無法復原。')){
      collabs = collabs.filter(c=>c.id!==delBtn.dataset.id); saveCollabs(); render();
    }
    return;
  }
  const histBtn = e.target.closest('[data-action=viewHistory]');
  if(histBtn){ openHistoryModal(histBtn.dataset.id); return; }
}

function bindFieldEditor(prefix, cfgKey){
  document.querySelectorAll(`[data-action=${prefix}Label]`).forEach(el=>{
    el.onchange = ()=>{ cfg[cfgKey][el.dataset.idx].label = el.value; saveConfig(); render(); };
  });
  document.querySelectorAll(`[data-action=del${prefix.toUpperCase()}]`).forEach(el=>{
    el.onclick = ()=>{ cfg[cfgKey].splice(el.dataset.idx,1); saveConfig(); render(); };
  });
  const btn = document.getElementById(`${prefix}AddBtn`);
  if(btn) btn.onclick = ()=>{
    const label = document.getElementById(`${prefix}NewLabel`).value.trim();
    const type = document.getElementById(`${prefix}NewType`).value;
    const optsRaw = document.getElementById(`${prefix}NewOptions`).value.trim();
    if(!label){ showToast('請輸入欄位名稱'); return; }
    const field = {id: uid(), label, type};
    if(type==='select') field.options = optsRaw ? optsRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];
    cfg[cfgKey].push(field);
    saveConfig(); render();
    showToast('已新增自訂欄位');
  };
}

/* ============================= Modal 共用 ============================= */
function openModal(html, opts){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-mask" id="modalMask"><div class="modal ${opts&&opts.wide?'wide':''}">${html}</div></div>`;
  document.getElementById('modalMask').addEventListener('mousedown', e=>{
    if(e.target.id==='modalMask') closeModal();
  });
  document.querySelectorAll('.modal .x, .modal [data-action=closeModal]').forEach(el=>el.onclick=closeModal);
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

    <div class="field"><label>${esc(f.label)}</label>${formInputForField(f,'pfv_'+f.id)}</div>`).join('');
  openModal(`
    <div class="modal-head"><h3>以表單新增專案</h3><button class="x">✕</button></div>
    <div class="modal-body">
      <div class="form-grid">

        <div class="field"><label>專案季度</label><select id="npQuarter">${qOpts}</select></div>

      <button class="btn primary" id="npSubmit">新增專案</button>

  document.getElementById('npSubmit').onclick = ()=>{

/* ---- 新增合作對象表單 ---- */
function openCollabFormModal(){
  const customFieldsHtml = cfg.collabFields.map(f=>`
    <div class="field"><label>${esc(f.label)}</label>${formInputForField(f,'cfv_'+f.id)}</div>`).join('');
  openModal(`
    <div class="modal-head"><h3>以表單新增合作對象</h3><button class="x">✕</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field full"><label>身份</label>
          <div>
            ${TYPE_OPTIONS.map(t=>`<label style="display:inline-flex;align-items:center;gap:5px;font-weight:500;margin-right:14px;"><input type="checkbox" class="ncType" value="${esc(t)}" ${t==='KOC'?'checked':''}> ${esc(t)}</label>`).join('')}
          </div>
        </div>
        <div class="field"><label>地區</label><input id="ncRegion" type="text"></div>
        <div class="field"><label>KOC/素人稱呼</label><input id="ncNickname" type="text"></div>
        <div class="field"><label>帳號名</label><input id="ncAccount" type="text" placeholder="@..."></div>
        <div class="field full"><label>IG 連結</label><input id="ncIgLink" type="text" placeholder="https://www.instagram.com/..."></div>
        <div class="field"><label>IG 粉絲數</label><input id="ncIg" type="number"></div>
        <div class="field"><label>Threads 粉絲數</label><input id="ncThreads" type="number"></div>
        <div class="field"><label>寵物種類</label><input id="ncPet" type="text"></div>

        <div class="field full"><label>合作作品</label><input id="ncPastWorks" type="text" placeholder="以逗號分隔多筆"></div>
        <div class="field full"><label>備註</label><textarea id="ncNotes"></textarea></div>
        ${customFieldsHtml}
      </div>

      <button class="btn" data-action="closeModal">取消</button>
      <button class="btn primary" id="ncSubmit">新增合作對象</button>
    </div>
  `);
  document.getElementById('ncSubmit').onclick = ()=>{
    const types = Array.from(document.querySelectorAll('.ncType:checked')).map(el=>el.value);
    const c = newCollab({
      nickname: document.getElementById('ncNickname').value.trim(),
      account: document.getElementById('ncAccount').value.trim(),
      igLink: document.getElementById('ncIgLink').value.trim(),
      igFollowers: document.getElementById('ncIg').value,
      igFollowersUpdatedAt: document.getElementById('ncIg').value ? new Date().toISOString().slice(0,10) : '',
      threadsFollowers: document.getElementById('ncThreads').value,
      petType: document.getElementById('ncPet').value,
      quoteMode: document.getElementById('ncQuote').value,
      pastWorks: document.getElementById('ncPastWorks').value,
      region: document.getElementById('ncRegion').value,
      notes: document.getElementById('ncNotes').value,
      types: types.length?types:['KOC'],
    });
    cfg.collabFields.forEach(f=>{
      const el = document.getElementById('cfv_'+f.id);
      if(el){ c.custom[f.id] = el.value; }
    });
    collabs.unshift(c); saveCollabs(); closeModal(); render();
    showToast('已新增合作對象');
  };
}

function formInputForField(f, elId){
  if(f.type==='select'){
    const opts = (f.options||[]).map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
    return `<select id="${elId}"><option value=""></option>${opts}</select>`;
  }
  if(f.type==='date') return `<input id="${elId}" type="date">`;
  if(f.type==='number') return `<input id="${elId}" type="number">`;
  return `<input id="${elId}" type="text">`;
}

/* ---- 指派 KOC / 活動內容 modal ---- */
function openAssignModal(projectId){
  const p = projects.find(x=>x.id===projectId); if(!p) return;
  renderAssignModal(p);
}
function renderAssignModal(p){
  const collabOpts = collabs.map(c=>`<option value="${c.id}">${esc(c.nickname||'(未命名)')} ${c.account?('· '+esc(c.account)):''}</option>`).join('');
  const rows = p.assignedKOCs.map((a,i)=>{
    const c = collabs.find(x=>x.id===a.collabId);
    return `
    <div class="assign-row" data-idx="${i}">
      <div class="row-top">
        <select data-action="assignCollab" data-idx="${i}">
          <option value="">— 選擇合作對象 —</option>
          ${collabs.map(cc=>`<option value="${cc.id}" ${cc.id===a.collabId?'selected':''}>${esc(cc.nickname||'(未命名)')}${cc.account?(' · '+esc(cc.account)):''}</option>`).join('')}
        </select>
        <button class="del-btn" data-action="delAssign" data-idx="${i}">✕</button>
      </div>
      <textarea placeholder="活動內容 / 交付項目 / 排程細節…" data-action="assignContent" data-idx="${i}">${esc(a.content||'')}</textarea>
    </div>`;
  }).join('');
  openModal(`
    <div class="modal-head">
      <div>
        <h3>指派 KOC・${esc(p.taskName || '未命名專案')}</h3>
        <div class="sub" style="margin-top:3px;color:var(--ink-soft);font-size:12px;">${esc(p.brand)} · ${esc(p.quarter)}</div>
      </div>
      <button class="x">✕</button>
    </div>
    <div class="modal-body" id="assignBody">
      ${rows || '<div class="sub" style="color:var(--ink-soft);">尚未指派任何合作對象</div>'}
      <button class="btn" id="btnAddAssign" style="margin-top:6px;">＋ 新增指派</button>
    </div>
    <div class="modal-foot">
      <button class="btn primary" data-action="closeModal">完成</button>
    </div>
  `, {wide:true});

  document.getElementById('btnAddAssign').onclick = ()=>{
    p.assignedKOCs.push({collabId:'', content:''});
    saveProjects(); renderAssignModal(p); render();
  };
  document.querySelectorAll('[data-action=assignCollab]').forEach(el=>{
    el.onchange = ()=>{ p.assignedKOCs[el.dataset.idx].collabId = el.value; saveProjects(); render(); };
  });
  document.querySelectorAll('[data-action=assignContent]').forEach(el=>{
    el.onchange = ()=>{ p.assignedKOCs[el.dataset.idx].content = el.value; saveProjects(); };
  });
  document.querySelectorAll('[data-action=delAssign]').forEach(el=>{
    el.onclick = ()=>{ p.assignedKOCs.splice(el.dataset.idx,1); saveProjects(); renderAssignModal(p); render(); };
  });
}

/* ---- 合作對象歷史紀錄 / 搜尋詳情 ---- */
function collabHistory(collabId){
  const hits = [];
  projects.forEach(p=>{
    (p.assignedKOCs||[]).forEach(a=>{
      if(a.collabId===collabId) hits.push({project:p, content:a.content});
    });
  });
  return hits;
}
function openHistoryModal(collabId){
  const c = collabs.find(x=>x.id===collabId); if(!c) return;
  const hist = collabHistory(collabId);
  const typesHtml = typeBadgesHtml(c.types);
  const histHtml = hist.length ? hist.map(h=>{
    const st = statusOf(h.project.status);
    return `<div class="history-item">
      <div class="h1"><span class="badge" style="background:${hexToRgba(st.color,.16)};color:${st.color}"><span class="bdot"></span>${esc(st.label)}</span> ${esc(h.project.taskName||'(未命名專案)')}</div>
      <div class="h2">${esc(h.project.brand)} · ${esc(h.project.quarter)}${h.content?(' · '+esc(h.content)):''}</div>
    </div>`;
  }).join('') : '<div class="sub" style="color:var(--ink-soft);">尚無系統內的合作專案紀錄</div>';

  openModal(`
    <div class="modal-head"><h3>合作對象詳情</h3><button class="x">✕</button></div>
    <div class="modal-body">
      <div class="profile-card">
        <div class="avatar">${esc((c.nickname||'?').slice(0,1))}</div>
        <div style="flex:1;">
          <div style="font-weight:700;font-size:15px;">${esc(c.nickname||'(未命名)')} ${typesHtml}</div>
          <div class="kv"><b>帳號：</b>${esc(c.account)||'—'}${c.igLink?` · <a href="${esc(c.igLink)}" target="_blank" rel="noopener">開啟IG</a>`:''}　<b>地區：</b>${esc(c.region)||'—'}</div>
          <div class="kv"><b>IG：</b>${fmtFollowers(c.igFollowers)}（${freshnessHtml(c.igFollowersUpdatedAt)}）　<b>Threads：</b>${fmtFollowers(c.threadsFollowers)}　<b>寵物種類：</b>${esc(c.petType)||'—'}</div>
          <div class="kv"><b>報價/合作模式：</b>${esc(c.quoteMode)||'—'}</div>
          ${c.pastWorks?`<div class="kv"><b>合作作品：</b>${esc(c.pastWorks)}</div>`:''}
          ${c.notes?`<div class="kv"><b>備註：</b>${esc(c.notes)}</div>`:''}
        </div>
      </div>
      <h3 style="font-size:13.5px;margin-bottom:8px;">系統內合作紀錄（${hist.length}）</h3>
      ${histHtml}
    </div>
    <div class="modal-foot"><button class="btn primary" data-action="closeModal">關閉</button></div>
  `, {wide:true});
}

/* ============================= 置頂搜尋（防止 KOC / 素人重複建檔） ============================= */
const searchInput = document.getElementById('globalSearch');
const searchDrop = document.getElementById('searchDrop');
searchInput.addEventListener('input', ()=>{
  const q = searchInput.value.trim().toLowerCase();
  if(!q){ searchDrop.style.display='none'; return; }
  const hits = collabs.filter(c=>{
    return (c.nickname||'').toLowerCase().includes(q) || (c.account||'').toLowerCase().includes(q);
  });
  if(!hits.length){
    searchDrop.innerHTML = `<div class="hint">查無符合「${esc(searchInput.value.trim())}」的資料，這可能是一位<b>新的</b>合作對象，可到「合作名單」新增，避免之後重複建檔。</div>`;
  } else {
    searchDrop.innerHTML = hits.map(c=>{
      const typesHtml = typeBadgesHtml(c.types);
      const histCount = collabHistory(c.id).length;
      return `<div class="search-hit" data-id="${c.id}">
        <div class="row1">${esc(c.nickname||'(未命名)')} ${typesHtml}</div>
        <div class="row2">${esc(c.account)||'—'} · IG ${fmtFollowers(c.igFollowers)} · 過往合作 ${histCount} 筆${c.region?(' · '+esc(c.region)):''}</div>
      </div>`;
    }).join('');
  }
  searchDrop.style.display='block';
});
searchDrop.addEventListener('click', e=>{
  const hit = e.target.closest('.search-hit');
  if(hit){ openHistoryModal(hit.dataset.id); searchDrop.style.display='none'; searchInput.value=''; }
});
document.addEventListener('click', e=>{
  if(!e.target.closest('.search-wrap')) searchDrop.style.display='none';
});

/* ============================= 啟動 ============================= */
loadAll();
</script>
